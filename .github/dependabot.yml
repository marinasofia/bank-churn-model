version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The saved model only loads under the scikit-learn version it was trained with.
      # Upgrade it together with a retrain, not through Dependabot.
      - dependency-name: scikit-learn
    groups:
      uv:
        patterns: ["*"]
