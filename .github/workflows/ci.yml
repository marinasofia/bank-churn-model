name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run --frozen --no-sync pytest -q
      - name: Smoke-test retraining into a scratch directory
        run: uv run --frozen --no-sync python -m churn.train --out /tmp/artifacts
      - run: uv run --frozen --no-sync python audit/fairness_audit.py
